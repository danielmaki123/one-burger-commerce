# Local development database only. Production runs on an Easypanel PostgreSQL
# service (see ops/production-readiness.md); this compose file is not a parity
# environment and must not be used as one.
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: oneburger
    ports:
      # Loopback only: keeps the dev database off the local network.
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
