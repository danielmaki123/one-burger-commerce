name: Publish GHCR Image

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Scan committed secrets
        run: npm run security:secrets

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build
        env:
          APP_BUILD_VERSION: ${{ github.sha }}

  contracts:
    runs-on: ubuntu-latest
    steps:
      # `fetch-depth: 0` no es decorativo: `docs-sync-contract.test.ts` compara la fecha del último
      # commit que tocó `prisma/schema.prisma` y `src/shared/ui/` contra la de `DESIGN_SYSTEM.md`, y
      # con el clon superficial por defecto (depth 1) esa historia no existe y la guarda se saltea.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Los guardrails de `AGENTS.md` como check propio: UI (primitivos, tokens y registro de
      # componentes), route handlers (50 líneas y sin Prisma), módulos (capas y dirección de las
      # dependencias), documentos sincronizados y la fuente única del total.
      - name: Contract tests
        run: npx vitest run src/shared/contracts src/shared/lib/order-totals-contract.test.ts

  migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: verify
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/verify?schema=public
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/verify?schema=public
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply migrations on an empty database
        run: npx prisma migrate deploy

      - name: Fail on schema drift between migrations and schema.prisma
        run: npx prisma migrate diff --from-url "$DATABASE_URL" --to-schema-datamodel prisma/schema.prisma --exit-code

  container:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: verify
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Builds the real image and runs it: a build that compiles but crashes at
      # startup (missing entrypoint files, failed migrations) fails this job.
      - name: Build production image
        run: docker build --build-arg APP_BUILD_VERSION=${{ github.sha }} -t one-burger-commerce:ci .

      - name: Run the container against a real database
        run: |
          docker run -d --name obc --network host \
            -e DATABASE_URL="postgresql://postgres:postgres@127.0.0.1:5432/verify?schema=public" \
            -e DIRECT_URL="postgresql://postgres:postgres@127.0.0.1:5432/verify?schema=public" \
            -e APP_ENV=production \
            -e NODE_ENV=production \
            -e PORT=3000 \
            one-burger-commerce:ci

      - name: Assert the app migrates, starts and serves traffic
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3000/api/readiness > /tmp/readiness.json; then
              break
            fi
            sleep 5
          done
          cat /tmp/readiness.json
          grep -q '"status":"ready"' /tmp/readiness.json
          # Se guarda la respuesta en un archivo antes de buscar: con `pipefail`,
          # un `| grep -q` que corta temprano le manda SIGPIPE al productor y el
          # paso falla con 141 aunque la aserción haya dado bien.
          curl -fsS http://127.0.0.1:3000/api/health > /tmp/health.json
          grep -q 'one-burger-commerce' /tmp/health.json
          curl -fsS http://127.0.0.1:3000/api/menu > /tmp/menu.json
          grep -q '"categories"' /tmp/menu.json
          test "$(curl -fsS -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/menu)" = "200"

      # Guards the image tooling: the ops scripts live in scripts/ but import
      # from src/, so a missing copy only shows up when they actually run.
      - name: Assert the first-admin bootstrap works inside the image
        run: |
          set -euo pipefail
          docker rm -f obc-bootstrap >/dev/null 2>&1 || true
          docker run -d --name obc-bootstrap --network host \
            -e DATABASE_URL="postgresql://postgres:postgres@127.0.0.1:5432/verify?schema=public" \
            -e DIRECT_URL="postgresql://postgres:postgres@127.0.0.1:5432/verify?schema=public" \
            -e APP_ENV=production \
            -e NODE_ENV=production \
            -e PORT=3001 \
            -e BOOTSTRAP_ADMIN_ON_START=true \
            -e BOOTSTRAP_ADMIN_EMAIL=ci-owner@example.com \
            -e BOOTSTRAP_ADMIN_PASSWORD=CiPassword12345 \
            -e BOOTSTRAP_ADMIN_NAME="CI Owner" \
            -e BOOTSTRAP_ADMIN_ROLE=owner \
            one-burger-commerce:ci
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3001/api/readiness > /dev/null; then
              break
            fi
            sleep 5
          done
          test "$(curl -fsS -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:3001/api/auth/admin/login \
            -H 'Content-Type: application/json' \
            -d '{"email":"ci-owner@example.com","password":"CiPassword12345"}')" = "200"
          # Mismo motivo que arriba: sin el pipe, `pipefail` no puede dispararse
          # por un SIGPIPE cuando grep encuentra la línea y corta.
          docker logs obc-bootstrap > /tmp/bootstrap.log 2>&1
          grep -q 'initial admin ready' /tmp/bootstrap.log

      - name: Container logs
        if: failure()
        run: |
          docker logs obc || true
          docker logs obc-bootstrap 2>&1 | tail -40 || true

  publish:
    needs:
      - verify
      - contracts
      - migrations
      - container
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/one-burger-commerce:main
            ghcr.io/${{ github.repository_owner }}/one-burger-commerce:${{ github.sha }}
          build-args: |
            APP_BUILD_VERSION=${{ github.sha }}
