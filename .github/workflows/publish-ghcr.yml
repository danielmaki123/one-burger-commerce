name: Publish GHCR Image

on:
  workflow_dispatch:
  push:
    branches:
      - main
  # La validación también corre en los PRs hacia `main`: sin esto, un PR se mergeaba con lo verde que
  # cada uno hubiera corrido en su máquina. Verificado el 2026-09-18: el PR que trajo este trigger ya
  # disparó los cuatro jobs (`verify`, `contracts`, `migrations`, `container`) sin `publish`.
  pull_request:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      # `fetch-depth: 0` para el gate de páginas: necesita el diff contra la base del PR (o contra el commit
      # anterior, en un push a `main`) para saber si hay que correr `build:webpack`. Hay un contrato que
      # exige esta línea: sin historia, el gate se saltearía.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Scan committed secrets
        run: npm run security:secrets

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build
        env:
          APP_BUILD_VERSION: ${{ github.sha }}

      # El build de Turbopack no valida los exports de una página: si la PR toca un `page.tsx` hay que
      # correr además el build de webpack. Va acá, dentro de `verify` (ya requerido), para no crear un
      # required check condicional que en una PR sin páginas quedaría en «Expected» para siempre.
      - name: Detect page changes (webpack gate)
        id: page-changes
        run: |
          set -euo pipefail
          BASE="${{ github.event.pull_request.base.sha }}"
          if [ -z "$BASE" ]; then BASE="HEAD^"; fi
          if git rev-parse --verify --quiet "$BASE^{commit}" > /dev/null; then
            git diff --name-only "$BASE"...HEAD > /tmp/changed.txt
          else
            # Sin base comparable se corre el build: un build de más es mejor que un gate que se saltea.
            echo "sin base comparable: se asume que hay páginas que validar"
            echo "src/app/desconocido/page.tsx" > /tmp/changed.txt
          fi
          node scripts/check-page-build-needed.mjs /tmp/changed.txt

      - name: Webpack build (páginas)
        if: steps.page-changes.outputs.needed == 'true'
        run: npm run build:webpack
        env:
          APP_BUILD_VERSION: ${{ github.sha }}

  contracts:
    runs-on: ubuntu-latest
    steps:
      # `fetch-depth: 0` no es decorativo: el gate de integridad de tests compara las allowlists de los
      # contratos contra la rama base para que una PR no pueda agregar una excepción nueva (la deuda
      # congelada no crece). Con el clon superficial por defecto (depth 1) esa comparación no tiene con
      # qué comparar y el ratchet se saltearía. Hay un contrato que exige esta línea.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Los guardrails de `AGENTS.md` como check propio: UI (primitivos, tokens y registro de
      # componentes), route handlers (50 líneas y sin Prisma), módulos (capas y dirección de las
      # dependencias), documentos sincronizados, la fuente única del total y **TDD** (toda ruta,
      # caso de uso y primitivo con su test; la deuda vieja está congelada con su motivo en el gate).
      - name: Contract tests
        run: npx vitest run src/shared/contracts src/shared/lib/order-totals-contract.test.ts

      # El gate de TDD corre como paso propio **además** del glob de arriba: así su resultado se ve
      # por nombre en el check run y no queda escondido detrás de los otros contratos.
      - name: TDD gate (todo código nuevo con su test)
        run: npx vitest run src/shared/contracts/tdd-contract.test.ts

      # TASK-AUD-001 — integridad de tests: expectativas tautológicas, tests enfocados (`.only`) y el
      # ratchet de la deuda congelada (skips inventariados y allowlists de los contratos) contra `main`.
      # Las suites de este archivo corren igual dentro del glob de arriba; el paso propio es para que el
      # resultado se lea por nombre y para que el ratchet tenga la historia del `fetch-depth: 0`.
      - name: Test integrity gate
        run: npx vitest run src/shared/contracts/test-integrity-contract.test.ts src/shared/contracts/test-integrity-policy.test.ts src/shared/contracts/test-integrity-allowances.test.ts

  migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: verify
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/verify?schema=public
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/verify?schema=public
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply migrations on an empty database
        run: npx prisma migrate deploy

      - name: Fail on schema drift between migrations and schema.prisma
        run: npx prisma migrate diff --from-url "$DATABASE_URL" --to-schema-datamodel prisma/schema.prisma --exit-code

  container:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: verify
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Builds the real image and runs it: a build that compiles but crashes at
      # startup (missing entrypoint files, failed migrations) fails this job.
      - name: Build production image
        run: docker build --build-arg APP_BUILD_VERSION=${{ github.sha }} -t one-burger-commerce:ci .

      - name: Run the container against a real database
        run: |
          docker run -d --name obc --network host \
            -e DATABASE_URL="postgresql://postgres:postgres@127.0.0.1:5432/verify?schema=public" \
            -e DIRECT_URL="postgresql://postgres:postgres@127.0.0.1:5432/verify?schema=public" \
            -e APP_ENV=production \
            -e NODE_ENV=production \
            -e PORT=3000 \
            one-burger-commerce:ci

      - name: Assert the app migrates, starts and serves traffic
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3000/api/readiness > /tmp/readiness.json; then
              break
            fi
            sleep 5
          done
          cat /tmp/readiness.json
          grep -q '"status":"ready"' /tmp/readiness.json
          # Se guarda la respuesta en un archivo antes de buscar: con `pipefail`,
          # un `| grep -q` que corta temprano le manda SIGPIPE al productor y el
          # paso falla con 141 aunque la aserción haya dado bien.
          curl -fsS http://127.0.0.1:3000/api/health > /tmp/health.json
          grep -q 'one-burger-commerce' /tmp/health.json
          curl -fsS http://127.0.0.1:3000/api/menu > /tmp/menu.json
          grep -q '"categories"' /tmp/menu.json
          test "$(curl -fsS -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/menu)" = "200"

      # Guards the image tooling: the ops scripts live in scripts/ but import
      # from src/, so a missing copy only shows up when they actually run.
      - name: Assert the first-admin bootstrap works inside the image
        run: |
          set -euo pipefail
          docker rm -f obc-bootstrap >/dev/null 2>&1 || true
          docker run -d --name obc-bootstrap --network host \
            -e DATABASE_URL="postgresql://postgres:postgres@127.0.0.1:5432/verify?schema=public" \
            -e DIRECT_URL="postgresql://postgres:postgres@127.0.0.1:5432/verify?schema=public" \
            -e APP_ENV=production \
            -e NODE_ENV=production \
            -e PORT=3001 \
            -e BOOTSTRAP_ADMIN_ON_START=true \
            -e BOOTSTRAP_ADMIN_EMAIL=ci-owner@example.com \
            -e BOOTSTRAP_ADMIN_PASSWORD=CiPassword12345 \
            -e BOOTSTRAP_ADMIN_NAME="CI Owner" \
            -e BOOTSTRAP_ADMIN_ROLE=owner \
            one-burger-commerce:ci
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3001/api/readiness > /dev/null; then
              break
            fi
            sleep 5
          done
          test "$(curl -fsS -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:3001/api/auth/admin/login \
            -H 'Content-Type: application/json' \
            -d '{"email":"ci-owner@example.com","password":"CiPassword12345"}')" = "200"
          # Mismo motivo que arriba: sin el pipe, `pipefail` no puede dispararse
          # por un SIGPIPE cuando grep encuentra la línea y corta.
          docker logs obc-bootstrap > /tmp/bootstrap.log 2>&1
          grep -q 'initial admin ready' /tmp/bootstrap.log

      - name: Container logs
        if: failure()
        run: |
          docker logs obc || true
          docker logs obc-bootstrap 2>&1 | tail -40 || true

  publish:
    # La imagen a GHCR es del artefacto de producción: solo se publica desde `main`, nunca desde un PR.
    # En un PR los cuatro checks de validación (`verify`, `contracts`, `migrations`, `container`) corren
    # igual, pero este job no se dispara.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs:
      - verify
      - contracts
      - migrations
      - container
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/one-burger-commerce:main
            ghcr.io/${{ github.repository_owner }}/one-burger-commerce:${{ github.sha }}
          build-args: |
            APP_BUILD_VERSION=${{ github.sha }}
